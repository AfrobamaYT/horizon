[package]
name = "horizon-mod-internals"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Per-mod generated view of declared game internals for WebAssembly mods"

[lib]
name = "mod_internals"

[dependencies]
horizon-mod-points = { path = "../horizon-mod-points" }

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[lints]
workspace = true
