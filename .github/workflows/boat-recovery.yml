name: boat-recovery
on:
  workflow_run:
    workflows: [dyna-checks]
    types: [requested, in_progress, completed]
  # A queued runner does not emit a new event when it crosses the ten-minute limit.
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
concurrency:
  # Serialize event handlers and sweeps so two controllers cannot cancel/rerun the same attempt.
  group: boat-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'arismoko/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # ONLY the controller workflow's trusted default-branch revision. Never use
      # workflow_run.head_sha, PR refs, artifacts, or files from the triggering PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/boat_controller.py
