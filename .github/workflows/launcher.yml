name: fork launcher dry run
# Implementation only: no automatic triggers, signing secrets or publication.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            rustflags: ''
          - os: windows-latest
            platform: windows-x64
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      HORIZON_LAUNCHER_REPOSITORY: arismoko/horizon
      RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 1
      HORIZON_LAUNCHER_NO_SELF_UPDATE: 1
      HORIZON_NO_AUDIO: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libvulkan-dev libssl-dev patchelf
      - name: Isolate every launcher path
        shell: bash
        run: |
          for name in HORIZON_HOME HORIZON_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME HORIZON_LAUNCHER_TRASH HORIZON_LAUNCHER_CLIPBOARD HORIZON_LAUNCHER_DESKTOP; do
            path="$RUNNER_TEMP/fork-smoke/$name"
            mkdir -p "$path"
            echo "$name=$path" >> "$GITHUB_ENV"
          done
      - name: Test and build
        shell: bash
        run: |
          cargo test --manifest-path launcher/Cargo.toml
          cargo build --release --manifest-path launcher/Cargo.toml
          python tools/stage_launcher_packaging.py staged-packaging --repository arismoko/horizon
          mkdir -p dist
      - name: Linux archives
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp launcher/target/release/horizon-launcher dist/horizon-fork-launcher
          tar -C dist -czf dist/horizon-fork-launcher-linux-x86_64.tar.gz horizon-fork-launcher
          bash staged-packaging/linux/appimage.sh dist/horizon-fork-launcher 0.2.0 dist
          rm dist/horizon-fork-launcher
      - name: Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item launcher/target/release/horizon-launcher.exe dist/horizon-fork-launcher.exe
          Compress-Archive dist/horizon-fork-launcher.exe dist/horizon-fork-launcher-windows-x64.zip
          Copy-Item dist/horizon-fork-launcher.exe dist/horizon-fork-launcher-setup.exe
          Remove-Item dist/horizon-fork-launcher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: fork-launcher-${{ matrix.platform }}
          path: dist/*
