name: mixins-check
# A native mod with a unified API slot and internals source listener, built through the launcher
# and horizon-mixins at this commit (tools/ci/mixins_check.sh), so a change that breaks
# native mods' staging fails here and not on a player's machine (#1102). Compile-only: no game
# runs and no vanilla data is read. Checked on main pushes and dispatches, not on pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One run per ref, queued: a started run finishes, and a newer main push replaces only the waiting one.
  group: mixins-check-${{ github.ref }}
  cancel-in-progress: false
env:
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
  # The game builds in the dev profile here (496 crates); its debug info is most of the build
  # directory and nothing in this check reads it. Without it the job fits the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  # Two runs were killed by a runner shutdown signal at crate 489 of 496 (horizon-client-lib, about 36 minutes in)
  # with the disk fine (main 95672cb54f); memory on the 16 GB runner is the suspect. Fewer parallel rustc processes
  # lower the peak.
  CARGO_BUILD_JOBS: 2
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"
  mixins-check:
    needs: route
    runs-on: ${{ needs.route.outputs.self_hosted == 'true' && 'dyna-large' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk the build does not need
        if: runner.environment == 'github-hosted'
        # A run died compiling the game with 1 MB of disk left (main 84e57e6a79).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add swap and show memory
        if: runner.environment == 'github-hosted'
        # The next run's log shows whether memory was the limit: compare this with the end of the build.
        run: |
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -g
      - name: Self-hosted image headers or rootless fallback
        if: runner.environment == 'self-hosted'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust and the headers the launcher and the game link against
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: false
      - name: Build the launcher
        run: cargo +stable build --locked --manifest-path launcher/Cargo.toml
      - name: Build the mod through the launcher at this commit
        run: tools/ci/mixins_check.sh "${CARGO_TARGET_DIR:-launcher/target}/debug/horizon-launcher" "$RUNNER_TEMP/mixins-check"
      - name: Memory and kills after the build
        if: always()
        run: |
          free -g
          dmesg 2>/dev/null | grep -iE 'out of memory|oom|killed process' | tail -5 || true
