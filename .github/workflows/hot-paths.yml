name: hot-paths
# Performance trends of the game's hot paths (docs/hot-path-trends.md): the server tick over mobs and hoppers,
# command and selector resolution, hook dispatch and attachment access, each on a fixed, seeded workload in the
# release game as shipped (ThinLTO). tools/hot_paths.py counts instructions and allocator calls per operation
# under Callgrind, which do not depend on the runner's speed, and takes wall time beside them. A run on main is
# recorded on the `perf-history` branch, whose index.html is the trend page.
#
# It measures; it never judges. No threshold fails this workflow, and it never runs on a pull request.
# On main pushes and by dispatch. A dispatch on another branch, or a push to a branch named `*-hot-paths` (to
# measure one commit: point such a branch at it), measures and uploads its result, and records nothing.
on:
  push:
    branches: [main, '*-hot-paths']
  workflow_dispatch:
permissions:
  contents: read
# One run at a time, on one runner. Main pushes coalesce: a started run finishes, and only the newest waiting
# push runs next, so a busy day costs one runner and a step is still narrowed to the pushes between two runs.
# Dispatches queue in their own group per ref and never displace main's runs.
concurrency:
  group: hot-paths-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  HORIZON_TELEMETRY_URL: "off"
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - uses: actions/checkout@v4
      - id: runner
        env:
          ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          # Only main pushes and dispatches run this workflow, both from this repository.
          SAME_REPO: true
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/dyna_ci_runner.sh >> "$GITHUB_OUTPUT"

  measure:
    needs: route
    # The workloads need the prepared vanilla data, which only Dyna's runners hold: with the pool off this run
    # measures nothing and says so, and the trend has a gap.
    if: needs.route.outputs.self_hosted == 'true'
    runs-on: dyna-large
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Choose build parallelism
        run: echo "CARGO_BUILD_JOBS=$(python3 tools/ci/cargo_jobs.py --job-mib 4096)" | tee -a "$GITHUB_ENV"
      - name: Self-hosted image headers or rootless fallback
        run: bash tools/ci/dyna_ci_deps.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare checkout-keyed vanilla data
        run: |
          for dir in minecraft datagen horizon-client tools; do
            if [ ! -d "/cache/horizon-local/$dir" ]; then
              echo "::error::prepared data unavailable on this runner: $dir"
              exit 1
            fi
          done
          HORIZON_DYNA_CACHE=true HORIZON_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" HORIZON_SHARED_SOURCE=/cache/horizon-local bash tools/ci/vanilla-data.sh
      # The profile players get, on the server build (no audio, no controllers). horizon-hot-paths-game is
      # horizon-game's entry, with one native listener mod it installs only for the hook workload.
      - name: Build the release game
        run: cargo build --release --locked -p horizon-hot-paths-game
      - name: Measure
        run: |
          set -euo pipefail
          target="${CARGO_TARGET_DIR:-$PWD/target}"
          # RUNNER_TEMP is a small tmpfs on a Dyna runner: scratch goes on the build volume, removed at the end.
          scratch=$(mktemp -d "$target/hot-paths.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          command -v valgrind > /dev/null || echo "::warning::no valgrind on this runner: instructions and allocations are not measured"
          python3 tools/hot_paths.py measure --game "$target/release/horizon-hot-paths-game" \
            --resources "$PWD/.local/horizon-client/26.3" --work "$scratch" \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/hot-paths.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hot-paths
          path: ${{ runner.temp }}/hot-paths.json
          if-no-files-found: error

  # The only job that may write, and only main's results: it checks the result against the record's schema,
  # keeps the known fields and nothing else, and commits to the `perf-history` branch, which it creates the first time.
  record:
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: hot-paths-record
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/hot_paths.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: hot-paths
          path: ${{ runner.temp }}/result
      - name: Record the run and redraw the page
        run: |
          set -euo pipefail
          history="$RUNNER_TEMP/history"
          url="https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code --heads "$url" perf-history > /dev/null; then
            git clone --quiet --depth 1 --branch perf-history "$url" "$history"
          else
            git init --quiet --initial-branch perf-history "$history"
            git -C "$history" remote add origin "$url"
          fi
          python3 tools/hot_paths.py record "$RUNNER_TEMP/result/hot-paths.json" "$history"
          python3 tools/hot_paths.py page "$history"
          git -C "$history" add runs index.html README.md
          git -C "$history" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Hot paths at ${GITHUB_SHA::12}"
          git -C "$history" push --quiet origin perf-history
          echo "Recorded. Trend page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/perf-history/index.html (history: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/perf-history)" >> "$GITHUB_STEP_SUMMARY"
