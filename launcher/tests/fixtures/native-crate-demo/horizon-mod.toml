# A flat package exercising raw helpers, bundled data and a post-build binary.
id = "crate_demo"
name = "Crate demo"
version = "0.1.0"
api = "0.2"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "81e323d6c74a27ac05aa6105bd6cea9cc9316372"
mixins = "ddd9700b21997c95d95ac6ee5ecafe3830cf622a"

[[native.injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "src/frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[native.post_build]]
bin = "bake"
